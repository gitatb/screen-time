<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Break Time</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
 tailwind.config = {
 darkMode: "class",
 theme: {
 extend: {
 colors: {
"primary": "#13a4ec",
"background-light": "#f6f7f8",
"background-dark": "#101c22",
},
 fontFamily: {
"display": ["Inter", "sans-serif"]
},
 borderRadius: {
"DEFAULT": "0.25rem",
"lg": "0.5rem",
"xl": "0.75rem",
"full": "9999px"
},
},
},
}
</script>
<style>
.material-symbols-outlined {
 font-variation-settings:
 'FILL' 0,
 'wght' 400,
 'GRAD' 0,
 'opsz' 24
}
</style>
</head>
<body class="font-display">
<div class="relative flex h-screen w-full flex-col items-center justify-center bg-background-light dark:bg-background-dark text-slate-800 dark:text-white group/design-root overflow-hidden">
<div class="layout-container flex h-full w-full grow flex-col items-center justify-center">
<main class="flex w-full max-w-2xl flex-col items-center justify-center gap-8 p-4 sm:p-6 md:p-8">
<!-- Headline Text -->
<h1 class="text-slate-900 dark:text-white tracking-tight text-3xl sm:text-4xl font-bold text-center">Time for a break</h1>
<!-- Timer and Progress Bar -->
<div class="relative w-full max-w-xs sm:max-w-sm flex flex-col items-center gap-6">
<!-- Timer -->
<div class="flex items-center gap-2 sm:gap-4">
<div class="flex basis-0 grow flex-col items-center gap-2">
<div class="flex h-20 w-20 sm:h-24 sm:w-24 items-center justify-center rounded-xl bg-slate-200 dark:bg-[#233c48]">
<p id="break-minutes" class="text-slate-900 dark:text-white text-4xl sm:text-5xl font-bold tracking-tighter">05</p>
</div>
<p class="text-slate-600 dark:text-[#92b7c9] text-sm font-normal">Minutes</p>
</div>
<div class="flex basis-0 grow flex-col items-center gap-2">
<div class="flex h-20 w-20 sm:h-24 sm:w-24 items-center justify-center rounded-xl bg-slate-200 dark:bg-[#233c48]">
<p id="break-seconds" class="text-slate-900 dark:text-white text-4xl sm:text-5xl font-bold tracking-tighter">00</p>
</div>
<p class="text-slate-600 dark:text-[#92b7c9] text-sm font-normal">Seconds</p>
</div>
</div>
<!-- Progress Bar -->
<div class="flex w-full flex-col gap-2">
<div class="h-2 rounded-full bg-slate-200 dark:bg-[#325567]">
<div id="break-progress-bar" class="h-2 rounded-full bg-primary" style="width: 100%;"></div>
</div>
</div>
</div>
<!-- Card -->
<div class="w-full max-w-lg p-4">
<div class="flex flex-col sm:flex-row items-center justify-between gap-6 rounded-xl bg-slate-100/80 dark:bg-black/20 p-6">
<div class="flex flex-col gap-3 flex-1">
<p class="text-slate-900 dark:text-white text-base font-bold leading-tight">Activity Suggestion</p>
<p id="activity-suggestion" class="text-slate-600 dark:text-[#92b7c9] text-sm font-normal leading-normal">Look at something 20 feet away for 20 seconds.</p>
<button id="next-suggestion-button" class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-8 px-3 flex-row-reverse bg-slate-200/80 dark:bg-[#233c48] text-slate-800 dark:text-white gap-2 text-sm font-medium leading-normal w-fit mt-2">
<span class="material-symbols-outlined text-base">arrow_forward</span>
<span class="truncate">Next Suggestion</span>
</button>
</div>
<div class="w-24 h-24 sm:w-32 sm:h-32 bg-center bg-no-repeat bg-cover rounded-lg flex-shrink-0" data-alt="Illustration of a person stretching their neck gently." style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCizLHGkhGQize5d9jHOVNmNLwWo0z9qtUekJ7CToVLVGDBZi-G77vXqouDSDZrypjGVXzh-HBHbHdKyZe2uUKhsiPVIX8yh_JG3oivgDJ4bxgS6nQFWIfxUCDxmGnzMu6ECDmfDISRv07zPzCpmXC3M5LnkmxeJPfBkMiRqq7vMbklsq4nea86LtYa96SrkOcF4TZpOsOD7uVumltCncyN5C7G7kcLvd79pX4sSf1GhZr1RhpNG27N4P-L048WWFQNZfrdQYS8mYAu");'></div>
</div>
</div>
<!-- Button Group -->
<div class="flex justify-center w-full">
<div class="flex w-full flex-wrap gap-3 px-4 py-3 max-w-md justify-center">
<button id="extend-break-button" class="flex min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-11 px-5 bg-slate-200 dark:bg-[#233c48] text-slate-800 dark:text-white text-sm font-bold leading-normal tracking-[0.015em] grow">
<span class="truncate">Extend Break (+1 min)</span>
</button>
<button id="skip-break-button" class="flex min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-11 px-5 bg-transparent text-slate-600 dark:text-slate-300 hover:bg-slate-100/50 dark:hover:bg-white/10 text-sm font-bold leading-normal tracking-[0.015em] grow">
<span class="truncate">Skip Break</span>
</button>
</div>
</div>
</main>
</div>
</div>
<script src="public/js/app.js"></script>
</body></html>
